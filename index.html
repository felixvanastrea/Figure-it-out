<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1c2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Figure It Out">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Figure It Out</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-screen pixel canvas (low-res, integer-scaled), counter drawn inside it. Single committed dark look. */
:root{
  --ground:#1a1c2c;
  --ink:#f4f4f4;
  --red:#b13e53;
  --yellow:#ffcd75;
  --blue:#41a6f6;
  --green:#38b764;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink);overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:none}
#app{
  position:fixed;inset:0;box-sizing:border-box;display:flex;touch-action:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
#wrap{flex:1;min-width:0;display:grid;place-items:center;overflow:hidden}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;-webkit-touch-callout:none}
</style>
</head>
<body>
<div id="app"><div id="wrap"><canvas id="c"></canvas></div></div>

<script>
/* =========================================================
   FIGURE IT OUT — pixel beta
   ========================================================= */
const app=document.getElementById('app'),wrap=document.getElementById('wrap'),cv=document.getElementById('c');
let ctx=cv.getContext('2d');
const mask=document.createElement('canvas');let mctx=mask.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=144,H=280,T=0;

/* ---------- palette (Sweetie 16) : ramps are [dark, base, light] ---------- */
const BG='#1a1c2c',SH='#0b0c18';
const R={
  red:['#5d275d','#b13e53','#ef7d57'],
  orange:['#b13e53','#ef7d57','#ffcd75'],
  yellow:['#ef7d57','#ffcd75','#f4f4f4'],
  green:['#257179','#38b764','#a7f070'],
  blue:['#3b5dc9','#41a6f6','#73eff7'],
  dim:['#29366f','#333c57','#566c86'],
};
const RAINBOW=['#ef7d57','#ffcd75','#a7f070','#73eff7','#41a6f6','#b13e53'];

/* ---------- utils ---------- */
const rand=n=>Math.floor(Math.random()*n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const U=()=>Math.min(W,H*.62);
const sz=f=>Math.round(U()*f);

/* ---------- 3x5 bitmap font ---------- */
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','?':'110001010000010','!':'010010010000010','.':'000000000000010',"'":'010010000000000',' ':'000000000000000','-':'000000111000000',':':'000010000010000'};
const textW=(s,z)=>s.length*4*z-z;
function put(c,s,x,y,z,col){c.fillStyle=col;for(let i=0;i<s.length;i++){const g=FONT[s[i]]||FONT['?'];for(let k=0;k<15;k++)if(g[k]==='1')c.fillRect(x+(i*4+k%3)*z,y+((k/3)|0)*z,z,z)}}
function drawText(s,x,y,z,col,center,shadow){s=s.toUpperCase();if(center)x=x-textW(s,z)/2;x=Math.round(x);y=Math.round(y);if(shadow)put(ctx,s,x,y+z,z,shadow);put(ctx,s,x,y,z,col)}

/* ---------- pixel shape primitives ---------- */
function span(c,x0,y0,D,col){c.fillStyle=col;const r=D/2;for(let j=0;j<D;j++){const dy=j+.5-r,w=Math.sqrt(Math.max(0,r*r-dy*dy)),a=Math.round(r-w),l=D-2*a;if(l>0)c.fillRect(x0+a,y0+j,l,1)}}
function rr(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x+1,y,w-2,h);ctx.fillRect(x,y+1,w,h-2)}
function drawDisc(x,y,d,rp,sc,a){
  const D=Math.round(d*sc);if(D<3)return;const x0=Math.round(x-D/2),y0=Math.round(y-D/2);
  ctx.globalAlpha=a*.6;span(ctx,x0,y0+2,D,SH);ctx.globalAlpha=a;
  span(ctx,x0,y0,D,rp[0]);span(ctx,x0+1,y0+1,D-3,rp[1]);
  span(ctx,x0+Math.round(D*.2),y0+Math.round(D*.17),Math.max(2,Math.round(D*.28)),rp[2]);
  if(D>14){ctx.fillStyle='#f4f4f4';ctx.fillRect(x0+Math.round(D*.25),y0+Math.round(D*.22),1,1)}
  ctx.globalAlpha=1;
}
function drawBox(x,y,d,rp,sc,a){
  const D=Math.round(d*sc);if(D<3)return;const x0=Math.round(x-D/2),y0=Math.round(y-D/2);
  ctx.globalAlpha=a*.6;rr(x0,y0+2,D,D,SH);ctx.globalAlpha=a;
  rr(x0,y0,D,D,rp[0]);ctx.fillStyle=rp[1];ctx.fillRect(x0+1,y0+1,D-3,D-3);
  ctx.fillStyle=rp[2];ctx.fillRect(x0+2,y0+2,Math.max(1,Math.round(D*.5)),1);ctx.fillRect(x0+2,y0+3,1,Math.max(1,Math.round(D*.3)));
  if(D>14){ctx.fillStyle='#f4f4f4';ctx.fillRect(x0+2,y0+2,1,1)}
  ctx.globalAlpha=1;
}
function pr(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x+3,y,w-6,h);ctx.fillRect(x+1,y+1,w-2,h-2);ctx.fillRect(x,y+3,w,h-6)}
function drawPill(o,x,y){
  const w=Math.round(o.w*o.sc),h=Math.round(o.h*o.sc);if(w<8||h<8)return;const x0=Math.round(x-w/2),y0=Math.round(y-h/2),rp=o.ramp;
  ctx.globalAlpha=o.a*.6;pr(x0,y0+3,w,h,SH);ctx.globalAlpha=o.a;
  pr(x0,y0,w,h,rp[0]);pr(x0+1,y0+1,w-2,h-4,rp[1]);ctx.fillStyle=rp[2];ctx.fillRect(x0+4,y0+2,w-8,1);
  if(o.sc>.8){const z=o.tz;
    if(o.text2){const tot=10*z+3,top=Math.round(y-2-tot/2);drawText(o.text,x,top,z,'#f4f4f4',true,rp[0]);drawText(o.text2,x,top+5*z+3,z,'#f4f4f4',true,rp[0])}
    else drawText(o.text,x,Math.round(y-2-2.5*z),z,'#f4f4f4',true,rp[0]);}
  ctx.globalAlpha=1;
}

/* ---------- sprites built from masks (outline + top light) ---------- */
const ARROW={w:33,h:31,m:(x,y)=>{const u=x-1,v=y-15;if(u<0||u>30)return false;return u<=16?Math.abs(v)<=4:Math.abs(v)<=30-u}};
const HEARTBM=['.##...##.','####.####','#########','#########','.#######.','..#####..','...###...','....#....'];
const HEART={w:38,h:34,m:(x,y)=>{const bx=Math.floor((x-1)/4),by=Math.floor((y-1)/4);if(x<1||y<1||by<0||by>7||bx<0||bx>8)return false;return HEARTBM[by][bx]==='#'}};
const SPR=new Map();
function sprite(def,rp){
  const key=def.w+'x'+def.h+(rp?rp[1]:'sh');if(SPR.has(key))return SPR.get(key);
  const c=document.createElement('canvas');c.width=def.w;c.height=def.h;const g=c.getContext('2d'),m=(x,y)=>x>=0&&y>=0&&x<def.w&&y<def.h&&def.m(x,y);
  for(let y=0;y<def.h;y++)for(let x=0;x<def.w;x++){
    const ins=m(x,y),edge=!ins&&(m(x-1,y)||m(x+1,y)||m(x,y-1)||m(x,y+1));let col=null;
    if(!rp){if(ins||edge)col=SH}
    else if(ins)col=!m(x,y-1)?rp[2]:(!m(x,y+1)||!m(x+1,y))?rp[0]:rp[1];
    else if(edge)col=rp[0];
    if(col){g.fillStyle=col;g.fillRect(x,y,1,1)}
  }
  SPR.set(key,c);return c;
}
function drawSprite(def,rp,x,y,sc,rot,a){
  if(sc<.05)return;const s=sprite(def,rp),sh=sprite(def,null),w=Math.max(1,Math.round(def.w*sc)),h=Math.max(1,Math.round(def.h*sc));
  for(const [img,dy,al] of [[sh,2,a*.6],[s,0,a]]){ctx.save();ctx.globalAlpha=al;ctx.translate(Math.round(x),Math.round(y)+dy);ctx.rotate(rot);ctx.drawImage(img,-Math.round(w/2),-Math.round(h/2),w,h);ctx.restore()}
}

/* ---------- sound (tiny chiptune synth) ---------- */
let ac,master;
function audio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.55;master.connect(ac.destination)}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function tone(f,d,type='square',v=.06,to,delay=0){
  if(!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);
}
function noise(d,v=.2){
  if(!ac)return;const t=ac.currentTime,n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='lowpass';
  f.frequency.setValueAtTime(5000,t);f.frequency.exponentialRampToValueAtTime(200,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);
}
const sfx={
  tap:()=>tone(660,.04,'square',.04),
  pop:i=>tone(392*Math.pow(2,i*3/12),.1,'square',.05),
  pass:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.14,'square',.055,null,i*.055)),
  fail:()=>{noise(.4,.28);tone(196,.45,'sawtooth',.07,49)},
  pad:f=>tone(f,.28,'triangle',.13),
  charge:c=>tone(180+c*700,.05,'square',.03),
  whoosh:()=>noise(.16,.12),
  kick:()=>tone(150,.14,'sine',.2,45),
  tick:()=>tone(1500,.03,'square',.035),
  glitch:()=>{noise(.3,.22);tone(70,.35,'sawtooth',.06,900)},
};

/* ---------- world state ---------- */
const LAST=18;
let level=0,L={},busy=false,deaths=0,objs=[],parts=[],rings=[],stars=[],timers=[],gen=0;
let shakeA=0,flashA=0,flashC='#fff',wipe=null,ctr={x:4,y:5},ctrOff=0,ctrV=0,roll=null;
const REWIND=5;

function after(t,fn){timers.push({t,fn,g:gen})}
function add(kind,x,y,d,ramp,extra){const o=Object.assign({kind,x,y,d,ramp,sc:0,v:0,tsc:1,a:1,delay:0,ox:0,oy:0},extra);objs.push(o);return o}
function squish(o){o.v-=.3}
function spots(sizes){
  const top=30,m=5,out=[];
  for(const d of sizes){let best=null;
    for(let i=0;i<500;i++){
      const x=d/2+m+Math.random()*Math.max(1,W-d-m*2),y=top+d/2+Math.random()*Math.max(1,H-top-d-m*2);
      best=best||{x,y,d};if(out.every(o=>Math.hypot(o.x-x,o.y-y)>(o.d+d)/2+8)){best={x,y,d};break}
    }out.push(best)}
  return out;
}
function hit(p){
  for(let i=objs.length-1;i>=0;i--){const o=objs[i];
    if(o.dead||o.ghost||o.nohit||o.delay>0||o.sc<.5)continue;
    const dx=Math.abs(p.x-o.x),dy=Math.abs(p.y-o.y);
    if(o.kind==='disc'){if(Math.hypot(dx,dy)<=o.d/2+3)return o}
    else if(o.kind==='pill'){if(dx<=o.w/2+3&&dy<=o.h/2+3)return o}
    else if(dx<=o.d/2+3&&dy<=o.d/2+3)return o;
  }return null;
}

/* ---------- juice ---------- */
function burst(x,y,cols,n=12,spd=1.8){
  if(RM)n=Math.ceil(n/3);const c=Array.isArray(cols)?cols:[cols];
  for(let i=0;i<n&&parts.length<500;i++){const a=Math.random()*Math.PI*2,s=(.3+Math.random())*spd;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.8,life:1,dec:.018+Math.random()*.025,col:c[rand(c.length)],s:1+rand(2),g:.07})}
}
function shatter(){
  for(const o of objs){if(o.dead)continue;const d=o.d||o.w||20,cols=o.ramp||[o.col||'#f4f4f4'];
    for(let i=0;i<Math.min(40,d*1.2);i++)parts.push({x:o.x+(Math.random()-.5)*d,y:o.y+(Math.random()-.5)*d,vx:(Math.random()-.5)*3,vy:-Math.random()*2.4,life:1,dec:.02+Math.random()*.02,col:cols[rand(cols.length)],s:1+rand(2),g:.11});
    o.dead=true}
}
function bounceCounter(){ctrOff=-7;ctrV=0}

/* ---------- flow ---------- */
function startWipe(col,mid,done){wipe={phase:'out',t:0,col,mid,done}}
function go(n,kind,from){busy=true;startWipe(kind==='fail'?'#b13e53':'#29366f',()=>{setLevel(n);if(from&&from>n)roll={from,to:n,t:0,last:from}},()=>{busy=false})}
function setLevel(n){
  gen++;timers=[];objs=[];parts=[];rings=[];level=n;ctr={x:4,y:5};bounceCounter();L={};roll=null;
  if(n>=1&&n<=LAST)L=LEVELS[n-1]()||{};
  if(!L.down)L.down=(p,e,onC)=>{if(onC){L.counter&&L.counter(p);return}const o=hit(p);if(o&&L.tap)L.tap(o,p,e)};
}
function pass(x,y){
  if(busy)return;busy=true;sfx.pass();
  burst(x,y,R.green.concat(R.yellow),22,2.3);rings.push({x,y,r:3,v:2.4,life:1,col:'#a7f070'});
  flashC='#a7f070';flashA=.16;after(.38,()=>go(level+1,'pass'));
}
function fail(){
  if(busy)return;busy=true;deaths++;sfx.fail();
  shakeA=RM?0:7;flashC='#b13e53';flashA=.55;shatter();
  try{navigator.vibrate&&navigator.vibrate([60,30,90])}catch(e){}
  const from=level,to=Math.max(1,level-REWIND);after(.5,()=>go(to,'fail',from));
}

/* =========================================================
   LEVELS
   ========================================================= */
const LEVELS=[
  /* 1 odd one out */
  ()=>{const d=sz(.24),odd=rand(3);
    spots([d,d,d]).forEach((p,i)=>add('disc',p.x,p.y,d,i===odd?R.blue:R.red,{ok:i===odd,delay:i*.07}));
    return{tap:(o,p)=>o.ok?pass(p.x,p.y):fail()}},

  /* 2 odd one out, but all blue — the odd one is smaller */
  ()=>{const d=sz(.21),odd=rand(5);
    spots([0,1,2,3,4].map(i=>i===odd?Math.round(d*.6):d)).forEach((p,i)=>add('disc',p.x,p.y,p.d,R.blue,{ok:i===odd,delay:i*.06}));
    return{tap:(o,p)=>o.ok?pass(p.x,p.y):fail()}},

  /* 3 the TAP button is a lie: touch nothing for 5s */
  ()=>{const b=add('pill',W/2,H*.5,0,R.red,{w:72,h:30,text:'TAP',tz:3});let t=0;
    return{down(){fail()},update(dt){t+=dt;b.a=Math.max(.1,1-t/5);b.tsc=1+Math.sin(t*8)*.06;if(t>=5)pass(W/2,H*.5)}}},

  /* 4 smallest to biggest */
  ()=>{const ds=[.11,.16,.21,.28].map(sz),ord=shuffle([0,1,2,3]);let next=0;
    spots(ord.map(i=>ds[i])).forEach((p,j)=>add('disc',p.x,p.y,p.d,R.yellow,{rank:ord[j],delay:j*.06}));
    return{tap(o,p){if(o.rank!==next)return fail();sfx.pop(next);burst(o.x,o.y,R.yellow,12);o.ghost=1;o.tsc=0;if(++next===4)pass(p.x,p.y)}}},

  /* 5 tap the circle once per square */
  ()=>{const k=2+rand(3),cd=sz(.24),bd=sz(.14);let n=0,tok=0;
    const ps=spots([cd,...Array(k).fill(bd)]);
    add('disc',ps[0].x,ps[0].y,cd,R.orange,{circle:1});
    ps.slice(1).forEach((p,i)=>add('box',p.x,p.y,bd,R.green,{delay:.06*(i+1)}));
    return{tap(o,p){if(!o.circle)return fail();n++;sfx.pop(n);squish(o);burst(o.x,o.y,R.orange,5,1.2);const my=++tok;
      if(n>k)return fail();if(n===k)after(.9,()=>{if(my===tok)pass(o.x,o.y)})}}},

  /* 6 hold it until it's full */
  ()=>{const o=add('box',W/2,H*.52,sz(.32),R.orange);let held=null,ch=0,tick=0;
    return{
      down(p,e,onC){if(onC||held!==null)return;if(hit(p)===o){held=e.pointerId;o.tsc=.88}},
      up(p,e){if(e.pointerId!==held)return;held=null;o.tsc=1;o.ox=o.oy=0;if(ch<1){if(e.type==='pointercancel'){ch=0;return}fail()}},
      update(dt){
        if(held===null){ch=Math.max(0,ch-dt*3);return}
        ch+=dt/1.1;tick-=dt;if(tick<=0){tick=.09;sfx.charge(ch)}
        const j=RM?0:ch*1.6;o.ox=Math.round((Math.random()-.5)*j*2);o.oy=Math.round((Math.random()-.5)*j*2);
        if(Math.random()<ch*.7)parts.push({x:o.x+(Math.random()-.5)*o.d,y:o.y+o.d/2,vx:(Math.random()-.5)*.4,vy:-.6-Math.random()*1.2,life:1,dec:.03,col:R.orange[2],s:1,g:-.01});
        if(ch>=1){held=null;o.ox=o.oy=0;o.tsc=1;pass(o.x,o.y)}},
      draw(){if(ch<=0||o.dead)return;const D=Math.round(o.d*o.sc),x0=Math.round(o.x+o.ox-D/2),y0=Math.round(o.y+o.oy-D/2),inn=D-5,h=Math.round(inn*Math.min(1,ch));
        ctx.fillStyle=R.yellow[1];ctx.fillRect(x0+2,y0+2+inn-h,inn,h);ctx.fillStyle='#f4f4f4';ctx.fillRect(x0+2,y0+2+inn-h,inn,1)}
    }},

  /* 7 stroop: the ink matters, not the word */
  ()=>{const names=['RED','BLUE','GREEN','YELLOW'],rs=[R.red,R.blue,R.green,R.yellow];
    const w=rand(4);let ink=rand(3);if(ink>=w)ink++;const other=[0,1,2,3].filter(i=>i!==w&&i!==ink)[rand(2)];
    const z=textW(names[w],4)<=W-10?4:3;
    add('text',W/2,H*.32,0,null,{str:names[w],z,col:rs[ink][1],shadow:rs[ink][0],nohit:1});
    const sw=shuffle([ink,w,other]),d=sz(.22),gap=(W-3*d)/4;
    sw.forEach((ci,i)=>add('box',gap+d/2+i*(d+gap),H*.62,d,rs[ci],{ok:ci===ink,delay:.15+i*.07}));
    return{tap:(o,p)=>o.ok?pass(p.x,p.y):fail()}},

  /* 8 simon says */
  ()=>{const rs=[R.red,R.blue,R.yellow,R.green],f=[262,330,392,523],d=sz(.3),g=6,cx=W/2,cy=H*.56;
    const pads=rs.map((r,i)=>add('box',cx+(i%2?1:-1)*(d/2+g/2),cy+(i<2?-1:1)*(d/2+g/2),d,r,{i,a:.35,delay:i*.06}));
    const seq=[];while(seq.length<3){const x=rand(4);if(x!==seq[seq.length-1])seq.push(x)}
    let mode='wait',idx=0,tok=0;
    const lite=(i,dur=.32)=>{const p=pads[i];p.a=1;p.tsc=1.12;sfx.pad(f[i]);after(dur,()=>{p.a=.35;p.tsc=1})};
    const idle=()=>{const my=++tok;after(3.5,()=>{if(my===tok&&mode==='input'&&idx===0)play()})};
    const play=()=>{mode='show';idx=0;seq.forEach((s,k)=>after(k*.55,()=>lite(s)));after(seq.length*.55,()=>{mode='input';idle()})};
    after(.8,play);
    return{tap(o,p){if(mode!=='input')return;lite(o.i,.2);burst(o.x,o.y,o.ramp,6,1.2);
      if(o.i!==seq[idx])return fail();idx++;idle();if(idx===seq.length)pass(p.x,p.y)}}},

  /* 9 throw it off the screen; a plain tap kills */
  ()=>{const o=add('box',W/2,H*.55,sz(.28),R.red),hx=o.x,hy=o.y;let dr=null;
    return{
      down(p,e,onC){if(onC||dr)return;if(hit(p)===o){dr={id:e.pointerId,sx:p.x,sy:p.y,ox:o.x,oy:o.y,m:0,lx:p.x,ly:p.y,vx:0,vy:0};o.tsc=1.12;o.back=false}},
      move(p,e){if(!dr||e.pointerId!==dr.id)return;o.x=dr.ox+p.x-dr.sx;o.y=dr.oy+p.y-dr.sy;dr.m=Math.max(dr.m,Math.hypot(p.x-dr.sx,p.y-dr.sy));dr.vx=p.x-dr.lx;dr.vy=p.y-dr.ly;dr.lx=p.x;dr.ly=p.y},
      up(p,e){if(!dr||e.pointerId!==dr.id)return;const d=dr;dr=null;o.tsc=1;

        else o.back=true},
      update(){if(o.back){o.x+=(hx-o.x)*.25;o.y+=(hy-o.y)*.25}}
    }},

  /* 10 everything is a trap; the level number is the exit */
  ()=>{const d=sz(.22),rs=[R.red,R.blue,R.yellow];
    spots([d,d,d]).forEach((p,i)=>add('disc',p.x,p.y,d,rs[i],{delay:i*.07,breathe:i}));
    return{tap(){fail()},counter(){pass(ctr.x+10,ctr.y+8)}}},

  /* 11 twins: touch both at once */
  ()=>{const d=sz(.26),y=H*.55,ts=[add('disc',W*.27,y,d,R.green,{i:0}),add('disc',W*.73,y,d,R.green,{i:1,delay:.07})];const held=new Map();
    const set=()=>new Set(held.values());
    return{
      down(p,e,onC){if(onC)return;const o=hit(p);if(!o)return;held.set(e.pointerId,o.i);sfx.tap();if(set().size===2)pass(W/2,y)},
      up(p,e){if(!held.has(e.pointerId))return;const i=held.get(e.pointerId);held.delete(e.pointerId);if(e.type==='pointercancel')return;if(!set().has(i))fail()},
      update(){const s=set();ts.forEach(t=>{t.tsc=s.has(t.i)?.85:s.size===1?1+Math.sin(T*12)*.09:1})},
      draw(){if(set().size!==1)return;const a=ts[0],b=ts[1],x1=b.x-b.d/2-3;ctx.fillStyle=R.green[2];
        for(let x=a.x+a.d/2+3+((T*24)%5);x<x1;x+=5)ctx.fillRect(Math.round(x),Math.round(y),2,1)}
    }},

  /* 12 arrows: blue = swipe with it, red = swipe against it */
  ()=>{let seq;do{seq=Array.from({length:4},()=>({dir:rand(4),rev:Math.random()<.5}))}while(seq.every(s=>s.rev)||seq.every(s=>!s.rev));
    let i=0,cur=null,sw=null;
    const spawn=()=>{const s=seq[i];cur=add('arrow',W/2,H*.52,0,s.rev?R.red:R.blue,{dir:s.dir,nohit:1,tsc:1.5})};spawn();
    return{
      down(p,e,onC){if(onC||sw||!cur)return;sw={id:e.pointerId,x:p.x,y:p.y}},
      up(p,e){if(!sw||sw.id!==e.pointerId)return;const dx=p.x-sw.x,dy=p.y-sw.y;sw=null;
        if(e.type==='pointercancel'||Math.hypot(dx,dy)<10||!cur)return;
        const d=Math.abs(dx)>Math.abs(dy)?(dx>0?0:2):(dy>0?1:3),s=seq[i],want=s.rev?(s.dir+2)%4:s.dir;
        if(d!==want)return fail();
        const v=[[1,0],[0,1],[-1,0],[0,-1]][d];cur.fly={vx:v[0]*5,vy:v[1]*5};burst(cur.x,cur.y,cur.ramp,8,1.4);sfx.whoosh();sfx.pop(i);cur=null;
        if(++i===seq.length)return pass(W/2,H*.52);after(.16,spawn)}
    }},

  /* 13 rhythm: tap on the beat, four times */
  ()=>{const h=add('heart',W/2,H*.5,0,R.red,{nohit:1,flash:0,tsc:1.4});const per=.6,start=.6;let clock=0,beat=-1,last=-9,cnt=0;
    return{
      down(p,e,onC){if(onC||clock<start-.2)return;const ph=(clock-start)/per,bi=Math.round(ph),err=Math.abs(ph-bi)*per;
        if(err>.15||bi===last)return fail();last=bi;cnt++;h.flash=.15;burst(h.x,h.y,R.red.concat(R.orange),10,1.6);sfx.pop(cnt+1);if(cnt===4)pass(h.x,h.y)},
      update(dt){clock+=dt;const b=Math.floor((clock-start)/per);
        if(clock>=start&&b>beat){beat=b;h.v+=.24;rings.push({x:h.x,y:h.y,r:12,v:1.1,life:1,col:R.red[2]});sfx.kick()}
        if(h.flash>0)h.flash-=dt}
    }},

  /* 14 the DON'T button is also a lie: tap it before it loses patience */
  ()=>{const b=add('pill',W/2,H*.5,0,R.red,{w:78,h:38,text:"DON'T",text2:'TAP',tz:2});let t=0,tick=0;
    return{tap(o,p){if(o===b)pass(p.x,p.y)},
      update(dt){t+=dt;if(t>1.4){const j=RM?0:(t-1.4)*1.4;b.ox=Math.round((Math.random()-.5)*j*2);b.oy=Math.round((Math.random()-.5)*j);
        tick-=dt;if(tick<=0){tick=Math.max(.07,.45-(t-1.4)*.16);sfx.tick()}}
        if(t>=4.2)fail()}}},

  /* 15 mirror: tap the cell opposite the lit one */
  ()=>{const c=Math.min(sz(.24),32),g=4,tot=c*3+g*2,ox=W/2-tot/2+c/2,oy=Math.max(34+c/2,H*.55-tot/2+c/2);let lit=rand(8);if(lit>=4)lit++;
    for(let i=0;i<9;i++)add('box',ox+(i%3)*(c+g),oy+((i/3)|0)*(c+g),c,i===lit?R.blue:R.dim,{ok:i===8-lit,delay:i*.03});
    return{tap:(o,p)=>o.ok?pass(p.x,p.y):fail()}},

  /* 16 flashlight: find the odd one out in the dark, let go on it */
  ()=>{const d=sz(.17),odd=rand(6);
    spots(Array(6).fill(d)).forEach((p,i)=>add(i===odd?'disc':'box',p.x,p.y,d,R.yellow,{ok:i===odd,delay:i*.05}));
    let t=0,dark=0,lt=null;
    return{
      down(p,e,onC){if(onC||lt||dark<1)return;lt={id:e.pointerId,x:p.x,y:p.y};sfx.tap()},
      move(p,e){if(lt&&lt.id===e.pointerId){lt.x=p.x;lt.y=p.y}},
      up(p,e){if(!lt||lt.id!==e.pointerId)return;lt=null;if(e.type==='pointercancel')return;const o=hit(p);if(!o)return;o.ok?pass(p.x,p.y):fail()},
      update(dt){t+=dt;dark=clamp((t-.8)/.5,0,1)},
      draw(){if(dark<=0)return;mctx.globalCompositeOperation='source-over';mctx.fillStyle='#07070d';mctx.fillRect(0,0,W,H);
        if(lt){mctx.globalCompositeOperation='destination-out';const lx=Math.round(lt.x),ly=Math.round(lt.y);span(mctx,lx-17,ly-17,34,'#000');
          for(let y=-23;y<=23;y++)for(let x=-23;x<=23;x++){const r=Math.hypot(x,y);if(r>=16&&r<23&&((x+y+lx+ly)&1)===0&&(r<19.5||((x+lx)%2===0)))mctx.fillRect(lx+x,ly+y,1,1)}}
        ctx.globalAlpha=dark;ctx.drawImage(mask,0,0);ctx.globalAlpha=1;
        for(const o of objs)if(Math.sin(T*2.3+o.x*.7+o.y*.3)>.985){ctx.fillStyle='#f4f4f4';ctx.fillRect(Math.round(o.x),Math.round(o.y),1,1)}}
    }},

  /* 17 the counter is NOT the exit anymore — it's hiding the exit */
  ()=>{ctrOff=0;ctrV=0;const gem=add('box',ctr.x+10,ctr.y+7,9,R.green,{nohit:1});let dr=null;
    const covered=()=>{const w=textW(String(level),3)+4;return !(gem.x+6<ctr.x-2||gem.x-6>ctr.x-2+w||gem.y+6<ctr.y-2||gem.y-6>ctr.y+17)};
    return{
      down(p,e,onC){if(onC&&!dr){dr={id:e.pointerId,sx:p.x,sy:p.y,ox:ctr.x,oy:ctr.y,m:0};return}
        if(!covered()&&Math.abs(p.x-gem.x)<10&&Math.abs(p.y-gem.y)<10)pass(gem.x,gem.y)},
      move(p,e){if(!dr||dr.id!==e.pointerId)return;ctr.x=clamp(dr.ox+p.x-dr.sx,0,W-24);ctr.y=clamp(dr.oy+p.y-dr.sy,0,H-18);dr.m=Math.max(dr.m,Math.hypot(p.x-dr.sx,p.y-dr.sy))},
      up(p,e){if(!dr||dr.id!==e.pointerId)return;const m=dr.m;dr=null;if(m<3&&e.type==='pointerup')fail()}
    }},

  /* 18 the game fakes your death (and the rewind). don't fall for it: touch nothing */
  ()=>{let fake=false,rev=false,still=0,heart=null,clock=0,beat=-1;const fakeTo=Math.max(1,LAST-REWIND);
    const Lv={glitch:false,counterText:null,
      down(){if(fake&&!rev)fail()},
      update(dt){
        if(heart&&!rev){clock+=dt;const b=Math.floor((clock-.6)/.6);if(clock>=.6&&b>beat){beat=b;heart.v+=.24;rings.push({x:heart.x,y:heart.y,r:12,v:1.1,life:1,col:R.red[2]});sfx.kick()}}
        if(!fake||rev||busy)return;still+=dt;Lv.glitch=(still%1.1)<.1;if(still>=4.5)reveal()}};
    after(.7,()=>{busy=true;sfx.fail();shakeA=RM?0:7;flashC='#b13e53';flashA=.55;shatter();
      startWipe('#b13e53',()=>{objs=[];parts=[];fake=true;Lv.counterText=String(fakeTo);ctr={x:4,y:5};bounceCounter();roll={from:LAST,to:fakeTo,t:0,last:LAST};
        heart=add('heart',W/2,H*.5,0,R.red,{nohit:1,flash:0,tsc:1.4})},
      ()=>{busy=false})});
    function reveal(){rev=true;busy=true;Lv.glitch=true;sfx.glitch();shakeA=RM?0:9;
      after(.4,()=>{objs.forEach(o=>burst(o.x,o.y,R.blue.concat(R.red),16,2.2));objs=[];Lv.counterText=null;Lv.glitch=false;bounceCounter();busy=false;pass(W/2,H/2)})}
    return Lv}
];

/* ---------- input ---------- */
function toP(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function counterStr(){return roll?String(roll.last):(L&&L.counterText||String(level))}
function onCounter(p){const w=textW(counterStr(),3);return p.x>=ctr.x-6&&p.x<=ctr.x+w+6&&p.y>=ctr.y-6&&p.y<=ctr.y+21}
app.addEventListener('pointerdown',e=>{
  e.preventDefault();audio();const p=toP(e);
  if(level===0){if(busy)return;if(iosPanel){iosPanel=false;return}if(hitInstall(p)){installBtn.pressed=e.pointerId;sfx.tap();return}go(1,'pass');return}
  if(level>LAST){if(!busy)go(0,'pass');return}
  if(busy)return;
  L.down(p,e,onCounter(p));
});
addEventListener('pointermove',e=>{if(L&&L.move)L.move(toP(e),e)});
addEventListener('pointerup',e=>{
  if(installBtn.pressed===e.pointerId){installBtn.pressed=null;if(level===0&&hitInstall(toP(e)))doInstall();return}
  if(L&&L.up)L.up(toP(e),e)});
addEventListener('pointercancel',e=>{if(L&&L.up)L.up(toP(e),e)});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- update ---------- */
function update(dt){
  T+=dt;const k=dt*60;
  for(const s of stars){s.y-=s.v*k;if(s.y<0){s.y+=H;s.x=Math.random()*W}}
  const due=[];timers=timers.filter(x=>{x.t-=dt;if(x.t<=0){due.push(x);return false}return true});
  for(const x of due)if(x.g===gen)x.fn();
  for(const o of objs){
    if(o.delay>0){o.delay-=dt;if(o.delay<=0)sfx.tap&&tone(900+rand(300),.025,'square',.02);continue}
    if(o.breathe!==undefined)o.tsc=1+Math.sin(T*4+o.breathe*2)*.07;
    o.v+=(o.tsc-o.sc)*.2*k;o.v*=Math.pow(.7,k);o.sc+=o.v*k;
    if(o.fly){o.x+=o.fly.vx*k;o.y+=o.fly.vy*k;o.fly.vx*=Math.pow(1.08,k);o.fly.vy*=Math.pow(1.08,k);
      if(Math.random()<.6)parts.push({x:o.x,y:o.y,vx:0,vy:0,life:.7,dec:.06,col:o.ramp[2],s:2,g:0});
      if(o.x<-80||o.x>W+80||o.y<-80||o.y>H+80)o.dead=true}
    if(o.ghost&&o.sc<.05)o.dead=true;
  }
  objs=objs.filter(o=>!o.dead);
  for(const p of parts){p.vy+=p.g*k;p.x+=p.vx*k;p.y+=p.vy*k;p.life-=p.dec*k}
  parts=parts.filter(p=>p.life>0);
  for(const r of rings){r.r+=r.v*k;r.life-=.035*k}
  rings=rings.filter(r=>r.life>0);
  shakeA*=Math.pow(.84,k);flashA*=Math.pow(.86,k);
  ctrV+=(0-ctrOff)*.25*k;ctrV*=Math.pow(.7,k);ctrOff+=ctrV*k;
  installBtn.v+=(installBtn.tsc-installBtn.sc)*.25*k;installBtn.v*=Math.pow(.7,k);installBtn.sc+=installBtn.v*k;
  if(wipe){wipe.t+=dt;if(wipe.t>=.3){if(wipe.phase==='out'){wipe.phase='in';wipe.t=0;wipe.mid&&wipe.mid()}else{const d=wipe.done;wipe=null;d&&d()}}}
  if(roll){roll.t+=dt;const v=Math.round(roll.from-(roll.from-roll.to)*clamp(roll.t/.36,0,1));
    if(v!==roll.last){roll.last=v;sfx.tick();ctrOff=-3;ctrV=0}if(roll.t>=.36)roll=null}
  if(L&&L.update)L.update(dt);
  if(level>LAST&&Math.random()<.5&&parts.length<300)parts.push({x:Math.random()*W,y:-2,vx:(Math.random()-.5)*.5,vy:.3+Math.random()*.6,life:2,dec:.006,col:RAINBOW[rand(6)],s:1+rand(2),g:.004});
}

/* ---------- draw ---------- */
function drawObj(o){
  if(o.delay>0||o.sc<=.03)return;const x=o.x+o.ox,y=o.y+o.oy;
  switch(o.kind){
    case 'disc':drawDisc(x,y,o.d,o.ramp,o.sc,o.a);break;
    case 'box':drawBox(x,y,o.d,o.ramp,o.sc,o.a);break;
    case 'pill':drawPill(o,x,y);break;
    case 'arrow':drawSprite(ARROW,o.ramp,x,y,o.sc,o.dir*Math.PI/2,o.a);break;
    case 'heart':drawSprite(HEART,o.flash>0?R.orange:R.red,x,y,o.sc,0,o.a);break;
    case 'text':ctx.globalAlpha=clamp(o.sc,0,1);drawText(o.str,x,y-2.5*o.z+(1-Math.min(1,o.sc))*8,o.z,o.col,true,o.shadow);ctx.globalAlpha=1;break;
  }
}
function wave(s,cx,y,z,t0,cols){
  const w=textW(s,z);let x=Math.round(cx-w/2);
  for(let i=0;i<s.length;i++){const c=s[i];if(c!==' '){const dy=Math.round(Math.sin(T*3.2+i*.55+t0)*z*.8);
    put(ctx,c,x,Math.round(y+dy)+z,z,SH);put(ctx,c,x,Math.round(y+dy),z,cols?cols[i%cols.length]:'#f4f4f4')}x+=4*z}
}
function drawCounter(){
  const s=counterStr(),z=3,w=textW(s,z),x=Math.round(ctr.x),y=Math.round(ctr.y+ctrOff);
  ctx.fillStyle=BG;ctx.fillRect(x-2,y-2,w+4,5*z+4);
  if(L.glitch){put(ctx,s,x-1,y,z,'#73eff7');put(ctx,s,x+1,y,z,'#b13e53');put(ctx,s,x+rand(2),y,z,'#f4f4f4')}
  else{put(ctx,s,x,y+1,z,'#333c57');put(ctx,s,x,y,z,'#f4f4f4')}
}
function draw(){
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  for(const s of stars){const tw=Math.sin(T*s.tw+s.x)*.5+.5;ctx.globalAlpha=.35+tw*.65;ctx.fillStyle=s.c;ctx.fillRect(Math.round(s.x),Math.round(s.y),1,1)}
  ctx.globalAlpha=1;
  ctx.save();
  if(shakeA>.3)ctx.translate(Math.round((Math.random()-.5)*shakeA*2),Math.round((Math.random()-.5)*shakeA*2));

  if(level===0){
    const z=12,qx=Math.round(W/2-textW('?',z)/2-2),qy=Math.round(H*.36-30+Math.sin(T*2)*3);
    [['#29366f',4],['#3b5dc9',3],['#b13e53',2],['#ef7d57',1]].forEach(([c,i])=>put(ctx,'?',qx+i,qy+i,z,c));
    put(ctx,'?',qx,qy,z,'#ffcd75');
    wave('FIGURE IT OUT',W/2,H*.62,2,0,RAINBOW);
    ctx.globalAlpha=.4+Math.sin(T*3)*.2;drawText('BETA',W/2,H*.62+20,1,'#94b0c2',true);ctx.globalAlpha=1;
    drawInstallUI();
  }else if(level>LAST){
    wave('YOU FIGURED',W/2,H*.32,2,0,RAINBOW);
    wave('IT OUT',W/2,H*.32+16,4,1,['#ffcd75']);
    drawText('DEATHS '+deaths,W/2,H*.32+48,2,'#73eff7',true,SH);
    ctx.globalAlpha=.5;drawText('BETA ENDS HERE',W/2,H*.32+66,1,'#94b0c2',true);ctx.globalAlpha=1;
  }else{
    for(const o of objs)drawObj(o);
    if(L.draw)L.draw();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)}
  for(const r of rings){ctx.globalAlpha=clamp(r.life,0,1);ctx.fillStyle=r.col;const n=Math.max(12,Math.round(r.r*6));
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2;ctx.fillRect(Math.round(r.x+Math.cos(a)*r.r),Math.round(r.y+Math.sin(a)*r.r),1,1)}}
  ctx.globalAlpha=1;
  if(level>=1&&level<=LAST)drawCounter();
  ctx.restore();

  if(L.glitch&&!RM){for(let i=0;i<3;i++){const y=rand(H),h=2+rand(6);ctx.drawImage(cv,0,y,W,h,rand(7)-3,y,W,h)}}
  if(flashA>.01){ctx.globalAlpha=flashA;ctx.fillStyle=flashC;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  if(wipe){
    const B=10,cols=Math.ceil(W/B)+1,rows=Math.ceil(H/B)+1,k=wipe.t/.3;ctx.fillStyle=wipe.col;
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
      let q=clamp(k*2-(i+j)/(cols+rows),0,1);q=q*q*(3-2*q);
      const s=wipe.phase==='out'?q:1-q;if(s<=0)continue;
      const z=s>=1?B:Math.round(s*B);ctx.fillRect(i*B+Math.floor((B-z)/2),j*B+Math.floor((B-z)/2),z,z);
    }
  }
}

/* ---------- sizing ---------- */
function resize(){
  const dpr=window.devicePixelRatio||1,cw=wrap.clientWidth,ch=wrap.clientHeight;if(!cw||!ch)return;
  const S=Math.max(1,Math.round(cw*dpr/144)),nw=Math.floor(cw*dpr/S),nh=Math.floor(ch*dpr/S);
  const changed=nw!==W||nh!==H;W=nw;H=nh;
  cv.width=W;cv.height=H;cv.style.width=(W*S/dpr)+'px';cv.style.height=(H*S/dpr)+'px';
  mask.width=W;mask.height=H;ctx=cv.getContext('2d');mctx=mask.getContext('2d');ctx.imageSmoothingEnabled=false;mctx.imageSmoothingEnabled=false;
  const sc=['#333c57','#333c57','#566c86','#566c86','#73eff7'];
  stars=Array.from({length:Math.round(W*H/110)},()=>({x:Math.random()*W,y:Math.random()*H,v:.02+Math.random()*.06,c:sc[rand(sc.length)],tw:1+Math.random()*3}));
  if(changed&&level>=1&&level<=LAST&&!busy&&!wipe)setLevel(level);
}
addEventListener('resize',resize);

/* ---------- install (only on the real site, never inside an embed) ---------- */
let TOP=false;try{TOP=window.top===window}catch(e){}
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
let deferredPrompt=null,installed=false,iosPanel=false;
const installBtn={w:76,h:24,sc:1,v:0,tsc:1,ramp:R.green,a:1,tz:2,text:'INSTALL',pressed:null};
const canInstall=()=>TOP&&!installed&&!isStandalone()&&(deferredPrompt||isIOS);
const btnY=()=>Math.round(H*.82);
const hitInstall=p=>canInstall()&&Math.abs(p.x-W/2)<=installBtn.w/2+4&&Math.abs(p.y-btnY())<=installBtn.h/2+4;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
addEventListener('appinstalled',()=>{installed=true;deferredPrompt=null});
if(TOP&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
function doInstall(){
  if(deferredPrompt){const d=deferredPrompt;d.prompt();d.userChoice.then(c=>{if(c.outcome==='accepted')installed=true}).catch(()=>{});deferredPrompt=null;return}
  if(isIOS)iosPanel=true;
}
function drawShareIcon(x,y,z){ctx.fillStyle='#73eff7';const f=(a,b,w,h)=>ctx.fillRect(x+a*z,y+b*z,w*z,h*z);
  f(0,4,1,7);f(8,4,1,7);f(0,10,9,1);f(0,4,3,1);f(6,4,3,1);f(4,0,1,8);f(3,1,3,1);f(2,2,1,1);f(6,2,1,1)}
function drawInstallUI(){
  if(canInstall()){installBtn.tsc=installBtn.pressed!==null?.9:1+Math.sin(T*3)*.03;drawPill(installBtn,W/2,btnY())}
  if(iosPanel){
    ctx.globalAlpha=.92;ctx.fillStyle=SH;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
    const y=Math.round(H*.3);
    drawText('ADD TO YOUR',W/2,y,2,'#ffcd75',true,'#5d275d');drawText('HOME SCREEN',W/2,y+13,2,'#ffcd75',true,'#5d275d');
    drawText('1. TAP',W/2-14,y+40,2,'#f4f4f4',true);drawShareIcon(Math.round(W/2+18),y+35,2);
    drawText('2. ADD TO',W/2,y+58,2,'#f4f4f4',true);drawText('HOME SCREEN',W/2,y+71,2,'#f4f4f4',true);
    ctx.globalAlpha=.5+Math.sin(T*3)*.2;drawText('TAP TO CLOSE',W/2,y+100,1,'#94b0c2',true);ctx.globalAlpha=1;
  }
}

/* ---------- loop + boot ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}
function start(d){resize();deaths=d&&d.deaths||0;const lv=d&&d.level;setLevel(lv>=1&&lv<=LAST?lv:0);requestAnimationFrame(frame)}
window.claude?.hot?.snapshot?.(()=>({level:level>LAST?0:level,deaths}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
